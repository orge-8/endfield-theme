<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自定义页面适配最小样例</title>

<!-- ============================================================
     这是 webui.json 里 mode:"custom" 的页面片段示例。
     宿主会把它塞进 <iframe sandbox="allow-scripts allow-forms"> 的 srcDoc，
     外面再包一层 CSP + SDK。所以你写的 <html>/<head> 实际会被当作 body 内容，
     保留完整结构只是为了能单独打开预览。

     本样例走「路线一」：全面接受宿主组件观感。
       A 层（必须）：消费 --maibot-* 令牌 + maibot-* 组件类 ⇒ 配色/直角自动跟随
       B 层（可选）：切角/眉标，靠 data-ef-page 门控
     ⚠ 如果你的页面已有一套自洽视觉、要求「没装主题时外观不变」，
       **不要抄组件类那部分**（宿主组件类无条件注入，会改掉未装主题时的 padding/字体）。
       改走路线二：只用令牌 + 门控 CSS，实例见 cv_lyric_context 2.23.0 的 lyrics.html。
     ⚠ 焦点环：不要写。宿主全局 outline:none!important，插件侧写了是死代码。
       （2026-11-23 撤销了原「焦点环强制项」，详见契约文档第 3 节。）
     ============================================================ -->

<style>
/* ---------- A 层：只用宿主令牌取色，不写死十六进制 ---------- */
/* 宿主传入的 13 个令牌（lib/plugin-page-theme.ts:95-115）：
   --maibot-background / surface / foreground / muted / soft / border /
   primary / primary-foreground / danger / radius / font-body / font-display / font-mono
   ⚠ 主题自己的 --ef-* 变量不会传进来，别用。 */
:root {
  --page-bg: var(--maibot-background);
  --page-ink: var(--maibot-foreground);
  --page-dim: var(--maibot-muted);
  --page-line: var(--maibot-border);
  --page-accent: var(--maibot-primary);
}
body { margin: 0; padding: 16px; font-size: 14px; line-height: 1.6; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
.stat { padding: 16px; }
.stat .number { font: 600 28px/1.3 var(--maibot-font-display); }
.stat .label { color: var(--page-dim); font-size: 12px; }
.hint { color: var(--page-dim); font-size: 12px; }

/* ---------- 焦点环：这里**故意什么都不写** ---------- */
/* 宿主往 iframe 里写死了：
     :focus,:focus-visible{outline:none!important;--tw-ring-shadow:0 0 #0000!important;...}
   （plugin-page-theme.ts:136），且这段是 SDK 收到 context 后 append 到
   **body 末尾**的（plugin-custom-page.ts:79/164），在你的 <style> 之后。

   层叠先比 !important 级别再比特异性 ⇒ 不带 !important 的插件规则必输，
   写了就是死代码。本契约不要求也不建议去覆盖它。
   键盘工作流请让自己的状态驱动一个可见标记（如 .item.active 的边框变色），
   不要依赖 CSS 焦点。详见契约文档第 3 节。 */

/* ---------- B 层：可选的终末地风味（门控在 data-ef-page） ---------- */
/* 没装主题时 adapter.js 不挂这个属性 ⇒ 下面整体不生效 ⇒ 保持官方观感。 */
html[data-ef-page='on'] .maibot-button {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}
html[data-ef-page='on'] .maibot-badge {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
}
html[data-ef-page='on'] .maibot-card-header::before { content: '// '; color: var(--page-dim); }
html[data-ef-page='on'] .maibot-number { font-variant-numeric: tabular-nums; }
</style>
</head>

<!-- maibot-page 是宿主提供的页面基类：它负责把背景/文字/字体设成当前主题值。
     不写这个类，你的页面底色会是 iframe 默认白，深色主题下就翻了。 -->
<body class="maibot-page">

<div class="maibot-card">
  <div class="maibot-card-header">训练概览</div>

  <div class="grid">
    <div class="maibot-card stat">
      <div class="number maibot-number">1284</div>
      <div class="label">已标注图片</div>
    </div>
    <div class="maibot-card stat">
      <div class="number maibot-number">96.2%</div>
      <div class="label">验证准确率</div>
    </div>
    <div class="maibot-card stat">
      <div class="number maibot-number">7</div>
      <div class="label">角色数</div>
    </div>
  </div>

  <div class="row">
    <!-- maibot-button / maibot-button-primary 是宿主组件类：
         宿主会采样真实 Button 的 11 项外观属性写进来，所以配色自动跟随。
         自己写 <button> 不加类 ⇒ 吃不到形状，只能靠令牌手动上色。 -->
    <button class="maibot-button maibot-button-primary" type="button">开始训练</button>
    <button class="maibot-button" type="button">导出模型</button>
    <span class="maibot-badge">v3</span>
    <label class="row"><input type="checkbox"> 仅看未标注</label>
    <select class="maibot-select"><option>全部角色</option></select>
  </div>

  <p class="hint">用键盘 Tab 走一遍上面的控件，每个都应该有焦点框。</p>
</div>

<script>
/* ---------- 能力探测（B 层门控） ----------
   完整版见 endfield-page-adapter.js，这里内联同一份逻辑。
   判据：圆角归零 + 宽体拉丁字体，两条都命中才挂 data-ef-page。
   ⚠ 不要用「强调色是荧光色」判：主题浅色下 primary 是墨色，会全部漏判。 */
(function () {
  'use strict';
  var WIDE_LATIN = /saira|bahnschrift/i;
  function token(n) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  }
  function isSquare() {
    var raw = token('--maibot-radius');
    if (!raw) return false;
    var nums = raw.match(/-?[\d.]+/g);
    if (!nums || !nums.length) return false;
    for (var i = 0; i < nums.length; i++) if (parseFloat(nums[i]) !== 0) return false;
    return true;
  }
  function apply() {
    var html = document.documentElement;
    if (isSquare() && WIDE_LATIN.test(token('--maibot-font-body'))) {
      html.setAttribute('data-ef-page', 'on');
    } else {
      html.removeAttribute('data-ef-page');
    }
    html.setAttribute('data-ef-mode', html.classList.contains('dark') ? 'dark' : 'light');
  }
  // 主题样式不在初始 srcDoc 里，是 SDK ready 后 postMessage 送的 ⇒ 必须监听事件
  window.addEventListener('maibot:context', apply);
  if (window.maibot && window.maibot.context && window.maibot.context.styles) apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply).catch(function () {});
})();
</script>
</body>
</html>
